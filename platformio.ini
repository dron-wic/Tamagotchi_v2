; Tamagotchi for LilyGO T-Display-S3-Pro (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM)
; Portrait UI is 222 x 480. Build:  pio run -t upload
; Monitor:     pio device monitor

[env:tdisplay-s3-pro]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
; DIO matches the boot ROM on this board. QIO in the image header
; resets in a loop (ets_loader.c 78) before the app starts.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
; Each OTA slot is 3 MB (see partitions.csv). The image must fit one slot.
board_upload.maximum_size = 3145728
board_build.flash_size = 16MB
extra_scripts = post:tools/pack_firmware.py

; Set your serial port if PlatformIO does not auto-detect it:
; upload_port = COM9
; monitor_port = COM9
; 921600 can drop the USB-Serial/JTAG link after the stub starts.
upload_speed = 115200
monitor_speed = 115200
; Opening the serial monitor should not reboot the board into a loop.
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    lvgl/lvgl@8.4.0
    lovyan03/LovyanGFX@1.2.7
    lewisxhe/SensorLib@0.2.2

build_flags =
    -DBOARD_HAS_PSRAM
    ; TinyUSB (USB_MODE=0) is linked so the microSD can be a USB disk, but
    ; USB.begin() runs only after the settings button. Until then the cable
    ; stays on USB-Serial/JTAG, the normal COM port. Flash mode stays DIO.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Arduino's MSC callback returns the LUN count instead of the max index.
    ; One disk must answer GET_MAX_LUN with 0, or Windows looks for a second drive.
    "-Wl,--wrap=tud_msc_get_maxlun_cb"
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
    ; Early V1.0 boards dim the backlight with PWM. V1.1 uses a 16-step pulse.
    ; Uncomment the next line only for V1.0:
    ; -DUSE_BL_PWM
    -O2

lib_ldf_mode = deep+
